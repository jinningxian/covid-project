[project]
name = "covid-project-notebooks"
version = "0.1.0"
description = "Reproducible analysis environment for the India COVID-19 notebooks"
requires-python = "==3.13.16"
dependencies = [
  "matplotlib==3.11.2",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "plotly==7.1.0",
  "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
  "ipykernel==7.4.0",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
